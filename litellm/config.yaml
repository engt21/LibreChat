model_list:
  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY
  - model_name: gptossbigctx:latest
    litellm_params:
      model: openai/gptossbigctx:latest
      api_base: http://192.168.50.201:11434/v1
      api_key: ollama

litellm_settings:
  set_verbose: false

general_settings:
  health_check_interval: 300
