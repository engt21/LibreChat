# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api:
    container_name: ${LIBRECHAT_API_CONTAINER_NAME:-LibreChat}
    ports:
      - "${LIBRECHAT_HOST_PORT:-3080}:${LIBRECHAT_CONTAINER_PORT:-3080}"
    depends_on:
      - mongodb
      - rag_api
    image: registry.librechat.ai/danny-avila/librechat-dev:latest
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=${LIBRECHAT_CONTAINER_PORT:-3080}
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./images:/app/client/public/images
      - ${LIBRECHAT_UPLOADS_DIR:-./uploads}:/app/uploads
      - ${LIBRECHAT_LOGS_DIR:-./logs}:/app/logs
  mongodb:
    container_name: ${LIBRECHAT_MONGO_CONTAINER_NAME:-chat-mongodb}
    image: mongo:8.0.20
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ${LIBRECHAT_MONGO_DATA_DIR:-./data-node}:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: ${LIBRECHAT_MEILI_CONTAINER_NAME:-chat-meilisearch}
    image: getmeili/meilisearch:v1.35.1
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ${LIBRECHAT_MEILI_DATA_DIR:-./meili_data_v1.35.1}:/meili_data
  vectordb:
    container_name: ${LIBRECHAT_VECTORDB_CONTAINER_NAME:-vectordb}
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    container_name: ${LIBRECHAT_RAG_OPENAI_CONTAINER_NAME:-rag_api}
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

volumes:
  pgdata2:
